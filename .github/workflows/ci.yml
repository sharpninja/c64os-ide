name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: windows-latest
    name: Build C64OS IDE (Windows + Linux)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache VICE source code
        uses: actions/cache@v3
        id: cache-vice-source
        with:
          path: third_party/vice
          key: vice-source-${{ hashFiles('.gitmodules', '.github/workflows/ci.yml') }}
          restore-keys: |
            vice-source-

      - name: Cache .NET NuGet packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.nuget/packages
            ~/.nuget/cache
          key: nuget-${{ hashFiles('global.json') }}
          restore-keys: |
            nuget-

      - name: Cache Windows build artifacts
        uses: actions/cache@v3
        with:
          path: artifacts/vice/win-x64
          key: vice-artifacts-windows-${{ github.sha }}
          restore-keys: |
            vice-artifacts-windows-

      - name: Build Windows (via build.cmd)
        shell: powershell
        run: |
          .\build.cmd BuildVice --Platform Windows 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows VICE build failed"
            exit 1
          }

      - name: Verify Windows artifacts
        shell: powershell
        run: |
          Write-Host "Checking for Windows VICE artifacts..."
          if (Test-Path "artifacts/vice/win-x64") {
            Get-ChildItem -Path "artifacts/vice/win-x64" -Recurse | Select-Object -First 20 | Format-Table
            Write-Host "✓ Windows artifacts generated successfully"
          } else {
            Write-Warning "Windows artifacts directory not found"
          }

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build-windows.log
            build-output*.txt
          retention-days: 7

      - name: Report build status
        if: success()
        run: |
          Write-Host "✓ Windows build completed successfully"
          Write-Host "Artifacts: artifacts/vice/win-x64"

      - name: Cache Windows build artifacts
        if: success()
        uses: actions/cache@v3
        with:
          path: artifacts/vice/win-x64
          key: vice-artifacts-windows-${{ github.sha }}
          restore-keys: |
            vice-artifacts-windows-

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux (NUKE + Autotools)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache VICE source code
        uses: actions/cache@v3
        id: cache-vice-source
        with:
          path: third_party/vice
          key: vice-source-${{ hashFiles('.gitmodules', '.github/workflows/ci.yml') }}
          restore-keys: |
            vice-source-

      - name: Cache .NET NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Cache NUKE build directory
        uses: actions/cache@v3
        with:
          path: .nuke
          key: nuke-build-${{ runner.os }}-${{ hashFiles('build/**/*.cs', 'global.json') }}
          restore-keys: |
            nuke-build-${{ runner.os }}-

      - name: Cache Linux build dependencies
        uses: actions/cache@v3
        id: cache-linux-deps
        with:
          path: /usr/local/apt-cache
          key: apt-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-

      - name: Cache VICE build directory
        uses: actions/cache@v3
        with:
          path: third_party/vice/vice/build
          key: vice-build-linux-${{ runner.os }}-${{ hashFiles('third_party/vice/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            vice-build-linux-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libpng-dev \
            libjpeg-dev \
            zlib1g-dev \
            gettext

      - name: Build VICE for Linux (NUKE)
        run: |
          chmod +x ./build.sh
          ./build.sh BuildVice --Platform Linux 2>&1 | tee build-linux.log
          if [ $? -ne 0 ]; then
            echo "Linux VICE build failed"
            exit 1
          fi

      - name: Verify build artifacts
        run: |
          echo "Checking for Linux VICE artifacts..."
          if [ -d "artifacts/vice/linux-x64" ]; then
            ls -la artifacts/vice/linux-x64 | head -20
            echo "✓ Linux artifacts generated successfully"
          else
            echo "⚠ Linux artifacts directory not found"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            build-linux.log
            build-output*.txt
          retention-days: 7

      - name: Report build status
        if: success()
        run: |
          echo "✓ Linux build completed successfully"
          echo "Artifacts: artifacts/vice/linux-x64"

      - name: Cache Linux build artifacts
        if: success()
        uses: actions/cache@v3
        with:
          path: artifacts/vice/linux-x64
          key: vice-artifacts-linux-${{ github.sha }}
          restore-keys: |
            vice-artifacts-linux-
